server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  # Fotos de campo: o app reduz antes de enviar, mas o limite padrão do nginx (1 MB) não serve.
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:3001;
    # A troca de Wi-Fi leva até ~1 min e meio e abrir a página da ONU espera até 95 s na API; o padrão do nginx é 60 s.
    proxy_read_timeout 110s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
