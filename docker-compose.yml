services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rede
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rede}
      POSTGRES_DB: rede_neutra
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rede -d rede_neutra"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://rede:${POSTGRES_PASSWORD:-rede}@db:5432/rede_neutra
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  db-data:
